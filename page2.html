<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="page2.css">
</head>
<body>
    <!--헤더-->
    <div id="header">
        <div>
            <img src="./img/logo.png">
            <div id="menu">
                <a href="index.html">홈</a>
                <a href="page2.html">아이들</a>
                <a href="page99.html">입양안내</a>
                <a href="page99.html">커뮤니티</a>
            </div>
            <div class="button">
                <a href="page4.html">입양 신청</a>
            </div>
        </div>
    </div><!--헤더 끝-->
    
    <!--메인-->
    <div id = "main">
        <div id = "mainInner">
            <div id="title">아이들</div>
            <div id="comment">새로운 가족을 기다리는 아이들을 만나보세요.</div>
            <!--필터박스-->
            <div id = "filterBox">
                <input id="filter1" placeholder="이름을 입력해 주세요...">
                <!--강아지/고양이 선택-->
                <select id="filter2" name = "petType">
                    <option value=''>선택없음</option>
                    <option value=1>강아지</option>
                    <option value=2>고양이</option>
                </select>
                <!--성별-->
                <select id="filter3" name = "gender">
                    <option value=''>선택없음</option>
                    <option value=1>여자</option>
                    <option value=0>남자</option>
                </select>
                <!--나이-->
                <input id="filter4" placeholder="나이 입력">
                <!--지역-->
                <select id = "filter5" onchange="guDongShow()" name = "si">
                    <option value=''>선택없음</option>
                    <option value=11000>서울시</option>
                    <option value=23000>인천시</option>
                    <option value=41170>안양시</option>
                    <option value=41390>시흥시</option>
                </select>
                <select id = "filter6" name = "gu">
                    <option value=''>선택없음</option>
                </select>
                <button class="button" onclick="petInfoShow()">검 색</button>
            </div><!--필터 박스 끝-->
            <!--pet List-->
            <div id = "pets">
            </div>
        </div><!--main inner 끝-->
    </div><!--메인 끝-->
    
    <!-- 푸터 -->
    <footer id="footer">
        <div class="footerInner">

            <!-- 왼쪽 : 사이트 소개 -->
            <div class="footerBrand">
            <img src="./img/logo.png">
            
            <p>
                새로운 가족을 기다리는 아이들과<br>
                따뜻한 인연을 연결합니다.
            </p>
        </div>

        <!-- 가운데 : 프로젝트 정보 -->
        <div class="footerInfo">
            <h3>PROJECT</h3>
            <p>반려동물 입양 플랫폼</p>
            <p>개발 기간 : 2026.07.27 ~ 2026.07.31</p>
            <p>HTML · CSS · JavaScript</p>
        </div>

        <!-- 가운데 : 팀원 -->
        <div class="footerTeam">
            <h3>DEVELOPER</h3>
            <p>안훈석 · 안병준</p>
            <p>황소연 · 권유린</p>
        </div>

        <!-- 오른쪽 : 문의 -->
        <div class="footerContact">
            <h3>CONTACT</h3>
            <p>☎ 02-1234-5678</p>
            <p>✉ info@pawme.com</p>
            <p>평일 10:00 ~ 18:00</p>
        </div>
    </footer>
    <script src="main.js"></script>
    <script src="page2.js"></script>
</body>
</html>
