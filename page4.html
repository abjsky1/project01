<html lang="en">
<head>
    <meta charset="utf-8">
    <title>입양 신청</title>
    <link rel="stylesheet" href='page4.css'>
</head>

<body>

    <div id="header">
        <div class="logo">
            <img src="./img/logo.png">
        </div>
        <div id="menu">
            <a href="#">홈</a>
            <a href="#">아이들</a>
            <a href="#">입양안내</a>
            <a href="#">커뮤니티</a>
        </div>
         <button class="button">입양 신청</button>

    </div>


    <!-- 본문 -->
    <div id="main">

        <!-- 왼쪽 입양 신청 -->
        <div class="leftBox">

            <h1>입양 신청</h1>
            <p class="explain"> 아이와의 행복한 시간을 위해 정보를 입력해주세요 </p>

            <!-- 이름 -->
            <div class="box">
                <label for="fname">이름</label>
                <input type="text" id="fname" name="fname">
            </div>

            <!-- 연락처 -->
            <div class="box">
                <label for="fnumber">연락처</label>
                <input type="text" id="fnumber" name="fnumber">
            </div>

            <!-- 가족 구성 -->
            <div class="box">
                <label for="ffamily">가족 구성</label>
                <input type="text" id="ffamily" name="ffamily">
            </div>

           <!-- 반려동물 경험 -->
            <div class="box">
            <label for="fexp">반려동물 경험</label>
            <input type="text" id="fexp" name="fexp">
            </div>

            <!-- 입양을 원하는 아이 -->
            <div class="box">
            <label for="pcode">입양을 원하는 아이</label>
            <input type="text" id="pcode" name="pcode">
            </div>

            <!-- 보호소 -->
            <div class="box">
            <label for="shcode">보호소</label>
            <input type="text" id="shcode" name="shcode">
            </div>

            <!-- 신청 사유 -->
            <div class="reasonBox">
            <label for="freason">신청 사유</label>
            <textarea id="freason" name="freason"></textarea>

            </div>

            <!-- 개인정보 동의 -->
            <div class="agreeBox">
            <input type="checkbox" id="acode" name="acode" value="true">
            <label for="acode"> 개인정보 수집 및 이용에 동의합니다. </label>
            <a href="#">[자세히 보기]</a>

            </div>

            <!-- 신청 버튼 -->
            <button type="button" class="submitButton"> 신청하기 </button>

             </div>

            <!-- 오른쪽 박스 -->
             <div class = "rightBox">
            <div class = "checkbox">
            <h2> 입양 전 꼭 확인해주세요! </h2> 
                    <ul>
                        <li>입양은 신중한 결정이 필요해요.</li>
                        <li>아이의 평생을 책임질 준비가 되었나요?</li>
                        <li>가족 모두의 동의가 필요해요.</li>
                        <li>경제적, 시간적 여유를 고려해주세요.</li>
                        <li>입양 후에도 상담 및 지원이 가능합니다.</li>
                    </ul>
                </div>

            <div class = "question">
                <h2> 문의사항</h2>
                <h2> 02-1234-5678</h2>
                <p> (평일 10:00 ~ 18:00)</p>
                <div class = "email">
                <h2> abc@gmail.com</h2>
                
                    </div>

                     </div>
            
            </div>



             

        </div>

   

</body>

</html>
